<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Simplified tray variant of source.svg: the pearl alone, with a firm rim so it reads at 16px on light and dark taskbars. -->
  <defs>
    <radialGradient id="pearl" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.32">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fdebf1"/>
      <stop offset="0.6" stop-color="#f5c3d8"/>
      <stop offset="0.82" stop-color="#fbd3ae"/>
      <stop offset="1" stop-color="#b79cec"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#pearl)" stroke="#a8447c" stroke-width="4"/>
  <ellipse cx="25" cy="24" rx="8" ry="5.5" transform="rotate(-30 25 24)" fill="#ffffff" opacity="0.9"/>
</svg>
