[package]
name = "dreamer"
version = "0.5.1"
description = "Dreamer: collect, link and deepen game ideas"
authors = []
edition = "2024"
default-run = "dreamer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dreamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = { version = "3.0.0", features = ["std"] }
chrono = "0.4.45"
thiserror = "2.0.21"
notify = "8"
notify-debouncer-mini = "0.7.0"
base64 = "0.22"
# Downscales card images before Claude sees them (view_attachment).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-normalization = "0.1"
trash = "5"
dom_smoothie = "0.19.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros"] }
tauri-plugin-dialog = "2"
# The SpriteCook API key lives in the OS credential store (Windows Credential Manager), never in the workspace.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Job Object so the Claude sidecar's whole process tree ends with the app (src/proc_guard.rs).
# Already in the lock file through Tauri; this only enables the needed API features.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
